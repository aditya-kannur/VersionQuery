services:
  - type: web
    name: versionquery-backend
    runtime: docker
    buildCommand: ""
    envVars:
      - key: GROQ_API_KEY
        sync: false          # paste value in Render dashboard
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_FALLBACK_MODELS
        value: llama-3.1-8b-instant,llama-3.3-70b-versatile
      - key: LLM_MAX_TOKENS
        value: 384
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
    healthCheckPath: /health
